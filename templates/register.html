{% extends 'layout.html' %}
{% block content %}
<h4>Register Student</h4>
<form id="registerForm" class="row g-3">
  <div class="col-md-4">
    <label class="form-label">Name</label>
    <input type="text" class="form-control" name="name" required />
  </div>
  <div class="col-md-4">
    <label class="form-label">Roll No</label>
    <input type="text" class="form-control" name="roll_no" required />
  </div>
</form>
<div class="my-3">
  <video id="video" width="480" height="360" autoplay playsinline class="border"></video>
  <canvas id="canvas" width="480" height="360" class="d-none"></canvas>
</div>
<button id="captureBtn" class="btn btn-primary">Capture & Register</button>
<div id="status" class="mt-3"></div>
<script src="/static/js/register.js"></script>
{% endblock %}
