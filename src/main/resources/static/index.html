<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Uploader</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f7f7f7; }
        h1 { color: #333; }
        .container { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px #0001; max-width: 700px; margin: auto; }
        .upload-section { margin-bottom: 32px; }
        .documents-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .documents-table th, .documents-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .documents-table th { background: #f0f0f0; }
        .pagination { margin-top: 16px; text-align: center; }
        .pagination button { margin: 0 4px; padding: 6px 12px; }
        .delete-btn { color: #fff; background: #e74c3c; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .delete-btn:hover { background: #c0392b; }
    </style>
</head>
<body>
<div class="container">
    <h1>Document Uploader</h1>
    <div class="upload-section">
        <form id="uploadForm">
            <input type="file" id="fileInput" required />
            <button type="submit">Upload</button>
        </form>
        <div id="uploadMsg"></div>
    </div>
    <table class="documents-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Filename</th>
            <th>Uploaded At</th>
            <th>Download</th>
            <th>Delete</th>
        </tr>
        </thead>
        <tbody id="documentsBody"></tbody>
    </table>
    <div class="pagination">
        <button id="prevPage">Previous</button>
        <span id="pageInfo"></span>
        <button id="nextPage">Next</button>
    </div>
</div>
<script>
    let currentPage = 0;
    const pageSize = 5;

    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files.length) return;
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        fetch('/api/documents/upload', {
            method: 'POST',
            body: formData
        })
        .then(res => res.text())
        .then(msg => {
            document.getElementById('uploadMsg').innerText = msg;
            fileInput.value = '';
            loadDocuments();
        })
        .catch(() => document.getElementById('uploadMsg').innerText = 'Upload failed.');
    });

    function loadDocuments() {
        fetch(`/api/documents?page=${currentPage}&size=${pageSize}`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('documentsBody');
                tbody.innerHTML = '';
                data.content.forEach(doc => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${doc.id}</td>
                        <td>${doc.filename}</td>
                        <td>${doc.uploadTime ? doc.uploadTime.replace('T', ' ').substring(0, 19) : ''}</td>
                        <td><a href="/api/documents/download/${doc.id}">Download</a></td>
                        <td><button class="delete-btn" onclick="deleteDocument(${doc.id})">Delete</button></td>
                    `;
                    tbody.appendChild(tr);
                });
                document.getElementById('pageInfo').innerText = `Page ${data.number + 1} of ${data.totalPages}`;
                document.getElementById('prevPage').disabled = data.first;
                document.getElementById('nextPage').disabled = data.last;
            });
    }

    document.getElementById('prevPage').onclick = function() {
        if (currentPage > 0) {
            currentPage--;
            loadDocuments();
        }
    };
    document.getElementById('nextPage').onclick = function() {
        currentPage++;
        loadDocuments();
    };

    window.deleteDocument = function(id) {
        if (confirm('Are you sure you want to delete this document?')) {
            fetch(`/api/documents/${id}`, { method: 'DELETE' })
                .then(res => res.text())
                .then(() => loadDocuments());
        }
    };

    // Initial load
    loadDocuments();
</script>
</body>
</html>
